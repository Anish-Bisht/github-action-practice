# What is the goal of your workflow
# Goal: Whenever someone changes the python code,
# linter will check if the syntax, format, indentation (Linting) is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Linter
        run: pip install ruff

      - name: Check the files for linting
        run: ruff check .
        
        
